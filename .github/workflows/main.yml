name: WebGL and Windows Build and Deploy

on:
  push:
    branches:
      - main
      - Bogdan/main

permissions:
  contents: write

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  # --- JOB 1: INCREMENT VERSION ---
  versioning:
    name: Increment Build Version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Bump Patch Version
        id: bump_version
        run: |
          # Read current version from file
          VERSION=$(cat version.txt)
          echo "Current Version: $VERSION"
          
          # Split version into x, y, z
          IFS='.' read -r major minor patch <<< "$VERSION"
          
          # Increment patch (z)
          patch=$((patch + 1))
          NEW_VERSION="$major.$minor.$patch"
          echo "New Version: $NEW_VERSION"
          
          # Save new version back to file
          echo "$NEW_VERSION" > version.txt
          
          # Set output variable for other jobs
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and Push New Version
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "chore: bump build version to ${{ steps.bump_version.outputs.new_version }} [skip ci]"
          git push

  # --- JOB 2: BUILD WEBGL ---
  buildWebGL:
    needs: versioning
    name: Build WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Git LFS Pull
        run: |
          git lfs pull
          git add .
          git reset --hard

      - name: Restore Library Cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: WebGL
          buildsPath: build
          version: ${{ needs.versioning.outputs.new_version }}

      - name: Upload WebGL Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-WebGL
          path: build/WebGL/*

  # --- JOB 3: BUILD WINDOWS ---
  buildWindows:
    needs: versioning
    name: Build Windows Standalone
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Git LFS Pull
        run: |
          git lfs pull
          git add .
          git reset --hard

      - name: Restore Library Cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Windows-

      - name: Build Windows
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneWindows64
          buildsPath: build
          version: ${{ needs.versioning.outputs.new_version }}

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-Windows
          path: build/StandaloneWindows64/*

  # --- JOB 4: DEPLOY WEBGL TO PAGES ---
  deployPages:
    needs: [versioning, buildWebGL]
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Only push WebGL live if on main branch
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WebGL Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-WebGL
          path: build_files

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build_files

  # --- JOB 5: DEPLOY WINDOWS TO BRANCH SIDE-BY-SIDE ---
  deployWindows:
    needs: [versioning, buildWindows]
    name: Deploy Windows to Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-Windows
          path: windows_temp

      # Create a version-named subfolder and move the download into it
      - name: Organize Version Folder
        run: |
          mkdir -p deploy_windows/v${{ needs.versioning.outputs.new_version }}
          cp -r windows_temp/* deploy_windows/v${{ needs.versioning.outputs.new_version }}/

      - name: Deploy Windows to Dedicated Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: windows-builds   # The branch housing all your zip/exe histories
          folder: deploy_windows   # Targets the folder containing 'v0.5.x'
          clean: false             # CRITICAL: Keeps old version folders intact!
