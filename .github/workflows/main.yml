name: WebGL Build and Deploy

on:
  push:
    branches:
      - main  # Make sure this matches your default branch name

permissions:
  contents: write  # Crucial for the deployment action to push to gh-pages

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  buildWebGL:
    name: Build WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Updated from v3
        with:
          lfs: true # Built-in LFS support is cleaner

      - name: Git LFS Pull
        run: |
          git lfs pull
          git add .
          git reset --hard

      - name: Build WebGL
        uses: game-ci/unity-builder@v4 # Updated from v3
        with:
          targetPlatform: WebGL

      - name: Upload WebGL Build Artifact
        uses: actions/upload-artifact@v4 # Updated from v3
        with:
          name: build-WebGL
          path: build

  deployPages:
    needs: buildWebGL
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Updated from v3

      - name: Download WebGL Build Artifact
        uses: actions/download-artifact@v4 # Updated from v3
        with:
          name: build-WebGL
          path: build # Kept path consistent with builder output

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4 # Updated from 4.1.4
        with:
          branch: gh-pages
          folder: build
