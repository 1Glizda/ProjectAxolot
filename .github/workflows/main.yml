name: CI/CD Build and Deploy

on:
  push:
    branches:
      - main
      - Bogdan/main

permissions:
  contents: write

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  # --- JOB 1: INCREMENT VERSION (Conflict-Safe) ---
  versioning:
    name: Increment Build Version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump Patch Version
        id: bump_version
        run: |
          VERSION=$(cat version.txt)
          IFS='.' read -r major minor patch <<< "$VERSION"
          NEW_VERSION="$major.$minor.$((patch + 1))"
          echo "$NEW_VERSION" > version.txt
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and Push Version
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "chore: bump version to ${{ steps.bump_version.outputs.new_version }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }} --force-with-lease

  # --- JOB 2: BUILD WEBGL ---
  buildWebGL:
    needs: versioning
    name: Build WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { lfs: true }

      # FIX 1: Restore Cache immediately after Checkout so the folder exists
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      # FIX 2: Free space after cache step, before builder execution
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"

      - name: Build
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: WebGL
          buildsPath: build
          version: ${{ needs.versioning.outputs.new_version }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-WebGL
          path: build/WebGL/*

  # --- JOB 3: BUILD WINDOWS ---
  buildWindows:
    needs: versioning
    name: Build Windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { lfs: true }

      # FIX 1: Restore Cache immediately after Checkout so the folder exists
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Windows-

      # FIX 2: Free space after cache step, before builder execution
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"

      - name: Build
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneWindows64
          buildsPath: build
          version: ${{ needs.versioning.outputs.new_version }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-Windows
          path: build/StandaloneWindows64/*

  # --- JOB 4: DEPLOY WEBGL ---
  deployPages:
    needs: [buildWebGL]
    name: Deploy WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Base
        uses: actions/checkout@v4
      - name: Download
        uses: actions/download-artifact@v4
        with:
          name: build-WebGL
          path: build_files
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build_files

  # --- JOB 5: DEPLOY WINDOWS (ZIPPED & PRUNED) ---
  deployWindows:
    needs: [versioning, buildWindows]
    name: Deploy Windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Base
        uses: actions/checkout@v4
      - name: Smart Fetch Windows History
        run: |
          git clone --branch windows-builds --single-branch https://github.com/${{ github.repository }}.git windows_history || mkdir -p windows_history
          rm -rf windows_history/.git || true
      - name: Download
        uses: actions/download-artifact@v4
        with:
          name: build-Windows
          path: windows_temp
      - name: Compress & Prune
        run: |
          VERSION="v${{ needs.versioning.outputs.new_version }}"
          cd windows_temp
          zip -r ../windows_history/WindowsBuild_${VERSION}.zip ./*
          cd ..
          echo "*.zip filter=lfs diff=lfs merge=lfs -text" > windows_history/.gitattributes
          cd windows_history
          ls -1 WindowsBuild_*.zip 2>/dev/null | sort -V | head -n -3 | xargs -r rm -f
      - name: Push
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: windows-builds
          folder: windows_history
          clean: true
          lfs: true
